<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>CREA Sesame en Bloques</title>

  <script src="blockly/blockly_compressed.js"></script>
  <script src="blockly/blocks_compressed.js"></script>
  <script src="blockly/python_compressed.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e; color: #2e3037;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #topbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; background: #A8A492;
      border-bottom: 2px solid #FCF9EA; flex-shrink: 0;
    }
    #topbar h1 { font-size:14px; font-weight:700; color:#FCF9EA; margin-right:auto; }
    button {
      padding: 6px 14px; border: none; border-radius: 7px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: filter 0.15s;
    }
    button:hover   { filter: brightness(1.15); }
    button:disabled{ opacity: 0.35; cursor: not-allowed; }
    #btn-mock    { background:#6d6f7a; color:#f2f3f5; }
    #btn-connect { background:#66BB6A; color:#E8F5E9; }
    #btn-run     { background:#771df6; color:#e0e0ec; }
    #btn-stop    { background:#e92c62; color:#eeeef0; }
    #btn-clear   { background:#45475a; color:#cdd6f4; }
    #status {
      font-size:11px; padding:4px 10px; border-radius:6px;
      background:#313244; color:#a6adc8; white-space:nowrap;
    }
    #status.ok  { background:#66BB6A; color:#E8F5E9; }
    #status.err { background:#e92c62; color:#eeeef0; }
    #main { display:flex; flex:1; overflow:hidden; min-height:0; }
    #blockly-div { flex:1; min-width:0; position:relative; }
    #preview {
      width:260px; flex-shrink:0; display:flex; flex-direction:column;
      background:#524646; border-left:2px solid #313244;
    }
    #preview h2 {
      font-size:12px; padding:9px 13px; color:#EC5B38;
      border-bottom:1px solid #313244; flex-shrink:0;
    }
    #code-output {
      flex:1; overflow-y:auto; padding:11px 13px;
      font-family:'Cascadia Code','Consolas',monospace;
      font-size:11px; line-height:1.65; color:#a6e3a1;
      white-space:pre-wrap; word-break:break-word;
    }
    #error-banner {
      display:none; background:#f38ba8; color:#1e1e2e;
      font-size:12px; font-weight:600; padding:6px 14px;
      text-align:center; flex-shrink:0;
    }
  </style>
</head>
<body>

<div id="topbar">
  <h1>Sesame Bot en Bloques</h1>
  <button id="btn-mock"    onclick="conectarMock()">Simular conexión</button>
  <button id="btn-connect" onclick="conectar()">Conectar robot</button>
  <button id="btn-run"     onclick="ejecutar()" disabled>Ejecutar</button>
  <button id="btn-stop"    onclick="detener()">Detener</button>
  <button id="btn-clear"   onclick="limpiar()">Limpiar</button>
  <span   id="status">Estado: Sin conexión</span>
</div>

<div id="error-banner">
  ADVERTENCIA: Blockly no cargó. Ejecuta <b>download_blockly.py</b> y reinicia.
</div>

<div id="main">
  <div id="blockly-div"></div>
  <div id="preview">
    <h2>Código generado en Python:</h2>
    <div id="code-output"># Arrastra bloques debajo de
# "🟢 Al iniciar" para ver
# el código aquí.</div>
  </div>
</div>

<script>
// ── Guard ────────────────────────────────────────────────────────────────────
if (typeof Blockly === 'undefined' || typeof Blockly.Python === 'undefined') {
  document.getElementById('error-banner').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  throw new Error('Blockly not loaded — run download_blockly.py');
}

const pyGen = Blockly.Python;

// ── Message strings ───────────────────────────────────────────────────────────
Blockly.Msg['CONTROLS_REPEAT_TITLE']                    = 'Repetir %1 veces';
Blockly.Msg['CONTROLS_REPEAT_INPUT_DO']                 = 'hacer';
Blockly.Msg['CONTROLS_REPEAT_TOOLTIP']                  = 'Repite los bloques internos N veces.';
Blockly.Msg['CONTROLS_REPEAT_HELPURL']                  = '';
Blockly.Msg['CONTROLS_WHILEUNTIL_OPERATOR_WHILE']       = 'Repetir mientras';
Blockly.Msg['CONTROLS_WHILEUNTIL_OPERATOR_UNTIL']       = 'Repetir hasta que';
Blockly.Msg['CONTROLS_WHILEUNTIL_TOOLTIP_WHILE']        = 'Repite los bloques mientras la condición sea verdadera.';
Blockly.Msg['CONTROLS_WHILEUNTIL_TOOLTIP_UNTIL']        = 'Repite los bloques hasta que la condición sea verdadera.';
Blockly.Msg['CONTROLS_WHILEUNTIL_HELPURL']              = '';
Blockly.Msg['MATH_NUMBER_TOOLTIP']                      = 'Un número.';
Blockly.Msg['MATH_NUMBER_HELPURL']                      = '';
Blockly.Msg['MATH_ARITHMETIC_HELPURL']                  = '';
Blockly.Msg['MATH_ARITHMETIC_TOOLTIP_ADD']              = 'Suma dos números.';
Blockly.Msg['MATH_ARITHMETIC_TOOLTIP_MINUS']            = 'Resta dos números.';
Blockly.Msg['MATH_ARITHMETIC_TOOLTIP_MULTIPLY']         = 'Multiplica dos números.';
Blockly.Msg['MATH_ARITHMETIC_TOOLTIP_DIVIDE']           = 'Divide dos números.';
Blockly.Msg['MATH_ARITHMETIC_TITLE']                    = '%1 %2 %3';
Blockly.Msg['MATH_ADDITION_SYMBOL']                     = '+';
Blockly.Msg['MATH_SUBTRACTION_SYMBOL']                  = '-';
Blockly.Msg['MATH_MULTIPLICATION_SYMBOL']               = '×';
Blockly.Msg['MATH_DIVISION_SYMBOL']                     = '÷';
Blockly.Msg['MATH_RANDOM_INT_TITLE']                    = 'número aleatorio entre %1 y %2';
Blockly.Msg['MATH_RANDOM_INT_TOOLTIP']                  = 'Número entero aleatorio entre los dos valores (inclusive).';
Blockly.Msg['MATH_RANDOM_INT_HELPURL']                  = '';
Blockly.Msg['LOGIC_BOOLEAN_TRUE']                       = 'verdadero';
Blockly.Msg['LOGIC_BOOLEAN_FALSE']                      = 'falso';
Blockly.Msg['LOGIC_BOOLEAN_TOOLTIP']                    = 'Un valor booleano: verdadero o falso.';
Blockly.Msg['LOGIC_BOOLEAN_HELPURL']                    = '';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_EQ']                 = 'Verdadero si los dos valores son iguales.';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_NEQ']                = 'Verdadero si los dos valores son distintos.';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_LT']                 = 'Verdadero si el primero es menor que el segundo.';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_LTE']                = 'Verdadero si el primero es menor o igual que el segundo.';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_GT']                 = 'Verdadero si el primero es mayor que el segundo.';
Blockly.Msg['LOGIC_COMPARE_TOOLTIP_GTE']                = 'Verdadero si el primero es mayor o igual que el segundo.';
Blockly.Msg['LOGIC_COMPARE_HELPURL']                    = '';
Blockly.Msg['LOGIC_OPERATION_AND']                      = 'y';
Blockly.Msg['LOGIC_OPERATION_OR']                       = 'o';
Blockly.Msg['LOGIC_OPERATION_TOOLTIP_AND']              = 'Verdadero si ambas condiciones son verdaderas.';
Blockly.Msg['LOGIC_OPERATION_TOOLTIP_OR']               = 'Verdadero si al menos una condición es verdadera.';
Blockly.Msg['LOGIC_OPERATION_HELPURL']                  = '';
Blockly.Msg['LOGIC_NEGATE_TITLE']                       = 'no %1';
Blockly.Msg['LOGIC_NEGATE_TOOLTIP']                     = 'Invierte el valor booleano.';
Blockly.Msg['LOGIC_NEGATE_HELPURL']                     = '';
// Variables — all required strings for the VARIABLE custom category
Blockly.Msg['VARIABLES_DEFAULT_NAME']                   = 'variable';
Blockly.Msg['VARIABLES_SET']                            = 'establecer %1 a %2';
Blockly.Msg['VARIABLES_GET']                            = '%1';
Blockly.Msg['VARIABLES_SET_TOOLTIP']                    = 'Asigna un valor a esta variable.';
Blockly.Msg['VARIABLES_GET_TOOLTIP']                    = 'El valor de esta variable.';
Blockly.Msg['VARIABLES_SET_HELPURL']                    = '';
Blockly.Msg['VARIABLES_GET_HELPURL']                    = '';
Blockly.Msg['RENAME_VARIABLE']                          = 'Renombrar variable...';
Blockly.Msg['NEW_VARIABLE']                             = 'Nueva variable...';
Blockly.Msg['NEW_VARIABLE_TITLE']                       = 'Nombre de la nueva variable:';
Blockly.Msg['VARIABLE_MODAL_TITLE']                     = 'Nueva variable';
Blockly.Msg['DELETE_VARIABLE']                          = 'Eliminar la variable "%1"';
Blockly.Msg['VARIABLE_ALREADY_EXISTS']                  = 'Ya existe una variable llamada "%1".';
Blockly.Msg['VARIABLE_ALREADY_EXISTS_FOR_ANOTHER_TYPE']= 'Ya existe una variable "%1" de otro tipo.';
Blockly.Msg['DELETE_VARIABLE_CONFIRMATION']             = '¿Eliminar %1 uso(s) de la variable "%2"?';
Blockly.Msg['CANNOT_DELETE_VARIABLE_PROCEDURE']         = 'No se puede eliminar "%1" porque es parte de "%2".';


// ── 1. Custom block definitions ───────────────────────────────────────────────
Blockly.defineBlocksWithJsonArray([
  {
    "type": "sesame_al_iniciar",
    "message0": "🟢 Al iniciar",
    "nextStatement": null,
    "colour": "#f9e2af",
    "tooltip": "Los bloques conectados aquí se ejecutan al presionar 'Ejecutar'"
  },
  {
    "type": "sesame_mover_adelante",
    "message0": "⬆ Mover adelante %1 segundo(s)",
    "args0": [{"type":"input_value","name":"DURACION","check":"Number"}],
    "previousStatement": null, "nextStatement": null,
    "colour": "#89b4fa", "tooltip": "Mueve el robot hacia adelante.", "inputsInline": true
  },
  {
    "type": "sesame_mover_atras",
    "message0": "⬇ Mover atrás %1 segundo(s)",
    "args0": [{"type":"input_value","name":"DURACION","check":"Number"}],
    "previousStatement": null, "nextStatement": null,
    "colour": "#89b4fa", "tooltip": "Mueve el robot hacia atrás.", "inputsInline": true
  },
  {
    "type": "sesame_girar_derecha",
    "message0": "↷ Girar derecha %1 segundo(s)",
    "args0": [{"type":"input_value","name":"DURACION","check":"Number"}],
    "previousStatement": null, "nextStatement": null,
    "colour": "#89b4fa", "tooltip": "Gira el robot a la derecha.", "inputsInline": true
  },
  {
    "type": "sesame_girar_izquierda",
    "message0": "↶ Girar izquierda %1 segundo(s)",
    "args0": [{"type":"input_value","name":"DURACION","check":"Number"}],
    "previousStatement": null, "nextStatement": null,
    "colour": "#89b4fa", "tooltip": "Gira el robot a la izquierda.", "inputsInline": true
  },
  {
    "type": "sesame_girar_angulo",
    "message0": "↺ Girar %1 %2 grados",
    "args0": [
      {"type":"field_dropdown","name":"LADO","options":[["derecha","derecha"],["izquierda","izquierda"]]},
      {"type":"input_value","name":"ANGULO","check":"Number"}
    ],
    "previousStatement": null, "nextStatement": null,
    "colour": "#89b4fa", "tooltip": "Gira el robot un ángulo (0-360).", "inputsInline": true
  },
  {
    "type": "sesame_detener",
    "message0": "⏹ Detener robot",
    "previousStatement": null, "nextStatement": null,
    "colour": "#f38ba8", "tooltip": "Detiene el robot inmediatamente."
  },
  {
    "type": "sesame_emote",
    "message0": "😊 Hacer emote %1",
    "args0": [{"type":"field_dropdown","name":"EMOTE","options":[
      ["rest","rest"],["swim","swim"],["dance","dance"],["wave","wave"],
      ["point","point"],["stand","stand"],["cute","cute"],["pushup","pushup"],
      ["freaky","freaky"],["bow","bow"],["worm","worm"],["shake","shake"],
      ["shrug","shrug"],["dead","dead"],["crab","crab"],["idle","idle"]
    ]}],
    "previousStatement": null, "nextStatement": null,
    "colour": "#cba6f7", "tooltip": "Hace que el robot realice un emote."
  }
]);

// ── REPLACE the variables section in your script with all of this ─────────────

// Step A: Define a custom "set variable" block with a text field for the name
// and a value input for the value. Simpler than Blockly's built-in variable
// system which doesn't work reliably in v9 without the full messages file.
Blockly.defineBlocksWithJsonArray([
  {
    "type": "sesame_var_set",
    "message0": "establecer variable %1 a %2",
    "args0": [
      {
        "type": "field_input",
        "name": "VAR_NAME",
        "text": "miVariable"
      },
      {
        "type": "input_value",
        "name": "VALUE"
      }
    ],
    "previousStatement": null,
    "nextStatement": null,
    "colour": "#f1a340",
    "tooltip": "Crea o actualiza una variable con el nombre y valor dados.",
    "inputsInline": true
  },
  {
    "type": "sesame_var_get",
    "message0": "variable %1",
    "args0": [
      {
        "type": "field_input",
        "name": "VAR_NAME",
        "text": "miVariable"
      }
    ],
    "output": null,
    "colour": "#f1a340",
    "tooltip": "El valor actual de esta variable. Escribe el mismo nombre que usaste al crearla."
  }
]);

// Step B: Python generators for the custom variable blocks
pyGen['sesame_var_set'] = (b) => {
  const name  = b.getFieldValue('VAR_NAME').trim() || 'miVariable';
  const value = pyGen.valueToCode(b, 'VALUE', pyGen.ORDER_NONE) || '0';
  return `${name} = ${value}\n`;
};

pyGen['sesame_var_get'] = (b) => {
  const name = b.getFieldValue('VAR_NAME').trim() || 'miVariable';
  return [name, pyGen.ORDER_ATOMIC];
};

// Step C: Replace the Variables category in toolboxConfig with this:
// (swap out the { kind:"category", name:"Variables", custom:"VARIABLE" } entry)
const variablesCategory = {
  kind: "category",
  name: "Variables",
  colour: "#f1a340",
  contents: [
    {
      kind: "block",
      type: "sesame_var_set",
      inputs: {
        VALUE: { shadow: { type: "math_number", fields: { NUM: 0 } } }
      }
    },
    {
      kind: "block",
      type: "sesame_var_get"
    }
  ]
};

// Also add to the exec namespace in editor.py so variables work at runtime —
// add this line inside the `namespace` dict in ejecutar_codigo():
//   "__builtins__": {"range": range, "print": print},
// Change the current "__builtins__": {} to the above so that variable
// assignments (x = 3) work in exec() without a NameError.


// ── 2. Python generators ──────────────────────────────────────────────────────
pyGen['sesame_al_iniciar']      = ()         => '';
pyGen['sesame_detener']         = ()         => 'detener()\n';
pyGen['sesame_emote']           = b          => `hacer_emote("${b.getFieldValue('EMOTE')}")\n`;
pyGen['sesame_mover_adelante']  = (b, gen)   => `mover_adelante(${pyGen.valueToCode(b,'DURACION',gen.ORDER_NONE)||'1'})\n`;
pyGen['sesame_mover_atras']     = (b, gen)   => `mover_atras(${pyGen.valueToCode(b,'DURACION',gen.ORDER_NONE)||'1'})\n`;
pyGen['sesame_girar_derecha']   = (b, gen)   => `girar_derecha(${pyGen.valueToCode(b,'DURACION',gen.ORDER_NONE)||'1'})\n`;
pyGen['sesame_girar_izquierda'] = (b, gen)   => `girar_izquierda(${pyGen.valueToCode(b,'DURACION',gen.ORDER_NONE)||'1'})\n`;
pyGen['sesame_girar_angulo']    = (b, gen)   => {
  const lado = b.getFieldValue('LADO');
  const ang  = pyGen.valueToCode(b, 'ANGULO', gen.ORDER_NONE) || '90';
  return lado === 'derecha'
    ? `girar_derecha_angulo(${ang})\n`
    : `girar_izquierda_angulo(${ang})\n`;
};


// ── 3. Toolbox ────────────────────────────────────────────────────────────────
const toolboxConfig = {
  kind: "categoryToolbox",
  contents: [
    {
      kind:"category", name:"Movimiento", colour:"#89b4fa",
      contents:[
        { kind:"block", type:"sesame_mover_adelante",
          inputs:{ DURACION:{ shadow:{ type:"math_number", fields:{ NUM:1 } } } } },
        { kind:"block", type:"sesame_mover_atras",
          inputs:{ DURACION:{ shadow:{ type:"math_number", fields:{ NUM:1 } } } } },
        { kind:"block", type:"sesame_girar_derecha",
          inputs:{ DURACION:{ shadow:{ type:"math_number", fields:{ NUM:1 } } } } },
        { kind:"block", type:"sesame_girar_izquierda",
          inputs:{ DURACION:{ shadow:{ type:"math_number", fields:{ NUM:1 } } } } },
        { kind:"block", type:"sesame_girar_angulo",
          inputs:{ ANGULO:{ shadow:{ type:"math_number", fields:{ NUM:90 } } } } },
        { kind:"block", type:"sesame_detener" }
      ]
    },
    {
      kind:"category", name:"Emotes", colour:"#cba6f7",
      contents:[{ kind:"block", type:"sesame_emote" }]
    },
    { kind:"sep" },
    {
      kind:"category", name:"Ciclos", colour:"#fab387",
      contents:[
        { kind:"block", type:"controls_repeat" },
        { kind:"block", type:"controls_whileUntil" }
      ]
    },
    {
      // custom:"VARIABLE" auto-manages the list and shows both
      // "establecer X a" AND "obtener X" blocks once a variable exists
      kind:"category", name:"Variables", colour:"#f1a340",
      custom:"VARIABLE"
    },
    {
      kind:"category", name:"Operadores", colour:"#a6e3a1",
      contents:[
        { kind:"block", type:"math_random_int",
          inputs:{
            FROM:{ shadow:{ type:"math_number", fields:{ NUM:1  } } },
            TO:{   shadow:{ type:"math_number", fields:{ NUM:10 } } }
          }
        },
        { kind:"block", type:"math_number", fields:{ NUM:1 } },
        { kind:"block", type:"math_arithmetic" }
      ]
    },
    {
      kind:"category", name:"Comparadores", colour:"#9fc5e8",
      contents:[
        { kind:"block", type:"logic_compare" },
        { kind:"block", type:"logic_operation" },
        { kind:"block", type:"logic_negate" },
        { kind:"block", type:"logic_boolean" }
      ]
    }
  ]
};


// ── 4. Inject workspace ───────────────────────────────────────────────────────
const workspace = Blockly.inject('blockly-div', {
  toolbox: toolboxConfig,
  theme: Blockly.Themes.Dark,
  grid: { spacing:24, length:4, colour:'#313244', snap:true },
  zoom: { controls:true, wheel:true, startScale:1.0, maxScale:3, minScale:0.3 },
  trashcan: true,
  scrollbars: true,
  sounds: false,
});


// ── 5. Starter "Al iniciar" block ─────────────────────────────────────────────
function colocarBloqueInicial() {
  const existe = workspace.getTopBlocks(false).find(b => b.type === 'sesame_al_iniciar');
  if (existe) return;
  const block = workspace.newBlock('sesame_al_iniciar');
  block.initSvg();
  block.render();
  block.moveBy(80, 80);
  block.setDeletable(false);
}

requestAnimationFrame(() => requestAnimationFrame(colocarBloqueInicial));


// ── 6. Code extractor ─────────────────────────────────────────────────────────
// BUG 1 FIX: the correct approach for Blockly 9.x is to generate the full
// workspace code and then extract only the portion belonging to the hat block,
// by walking the chain manually but using blockToCode with ONLY the single
// block (not its chain) — achieved by temporarily nulling nextConnection.
function extraerCodigo() {
  const hat = workspace.getTopBlocks(true).find(b => b.type === 'sesame_al_iniciar');
  if (!hat) return '';

  pyGen.init(workspace);

  // Collect code for each block in the chain individually.
  // We generate code block-by-block to avoid the recursive duplication,
  // but use the generator's own blockToCode which handles value inputs,
  // loops (which have inner chains), and variables correctly.
  const lines = [];
  let cur = hat.getNextBlock();

  while (cur) {
    // Save and temporarily sever the next connection so blockToCode
    // only generates THIS block (and its inner body for loops), not
    // the entire remaining chain, which was causing the duplication.
    const savedNext = cur.nextConnection && cur.nextConnection.targetConnection;
    if (savedNext) cur.nextConnection.disconnect();

    try {
      const code = pyGen.blockToCode(cur);
      if (code) {
        const text = typeof code === 'string' ? code : code[0];
        if (text.trim()) lines.push(text.trimEnd());
      }
    } finally {
      // Always reconnect, even if code generation threw
      if (savedNext) cur.nextConnection.connect(savedNext);
    }

    cur = cur.getNextBlock();
  }

  return lines.join('\n');
}


// ── 7. Live preview ───────────────────────────────────────────────────────────
workspace.addChangeListener(() => {
  try {
    const code = extraerCodigo();
    document.getElementById('code-output').textContent =
      code || '# Arrastra bloques debajo de\n# "🟢 Al iniciar" para ver\n# el código aquí.';
  } catch(e) {
    console.error('Error generando código:', e);
    document.getElementById('code-output').textContent = '# Error generando código:\n# ' + e.message;
  }
});


// ── 8. UI actions ─────────────────────────────────────────────────────────────
function setStatus(msg, tipo) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = tipo || '';
}

async function waitForApi(retries=20) {
  for (let i=0; i<retries; i++) {
    if (window.pywebview?.api) return true;
    await new Promise(r => setTimeout(r, 150));
  }
  return false;
}

async function conectar() {
  setStatus('Conectando...','');
  if (!await waitForApi()) { setStatus('Error: API no disponible','err'); return; }
  const res = await window.pywebview.api.conectar(false);
  if (res.ok) { setStatus(res.mensaje,'ok'); document.getElementById('btn-run').disabled=false; }
  else setStatus('Error: '+res.mensaje,'err');
}

async function conectarMock() {
  setStatus('Conectando simulación...','');
  if (!await waitForApi()) { setStatus('Error: API no disponible','err'); return; }
  const res = await window.pywebview.api.conectar(true);
  if (res.ok) { setStatus('Simulación activa','ok'); document.getElementById('btn-run').disabled=false; }
  else setStatus('Error: '+res.mensaje,'err');
}

async function ejecutar() {
  const code = extraerCodigo().trim();
  if (!code) { setStatus('Agrega bloques dentro de "Al iniciar"','err'); return; }
  if (!await waitForApi()) { setStatus('Error: API no disponible','err'); return; }
  setStatus('Ejecutando...','');
  const res = await window.pywebview.api.ejecutar_codigo(code);
  if (res?.ok) setStatus('Ejecución iniciada','ok');
  else setStatus('Error al ejecutar','err');
}

async function detener() {
  if (!await waitForApi()) return;
  await window.pywebview.api.detener();
  setStatus('Detenido','err');
}

function limpiar() {
  workspace.clear();
  requestAnimationFrame(() => requestAnimationFrame(colocarBloqueInicial));
  document.getElementById('btn-run').disabled = true;
  setStatus('Sin conectar','');
}
</script>
</body>
</html>
