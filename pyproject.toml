[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-sesame-lib"
version = "0.1.0"
description = "High-level abstraction layer for CREA Sesame robot control"
requires-python = ">=3.9"
dependencies = [
    "crea-sesame-companion @ git+https://github.com/CREA-sesame-robot/CREA-sesame-companion.git@1365374ff23a46b8ef02186247dde6180fff8843",
    "pywebview>=5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crea_sesame_lib*"]